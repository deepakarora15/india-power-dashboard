<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C84E00"/>
      <stop offset="50%" style="stop-color:#E86F11"/>
      <stop offset="100%" style="stop-color:#F4941B"/>
    </linearGradient>
  </defs>
  <rect width="320" height="100" rx="12" fill="url(#bg)"/>
  <!-- Italic i with circle -->
  <circle cx="38" cy="42" r="18" fill="none" stroke="#8B0000" stroke-width="3"/>
  <text x="30" y="52" font-family="serif" font-size="32" font-weight="bold" font-style="italic" fill="white">i</text>
  <!-- ICICI text -->
  <text x="58" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">CICI</text>
  <!-- G in circle -->
  <circle cx="148" cy="42" r="12" fill="none" stroke="white" stroke-width="2.5"/>
  <text x="141" y="48" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">G</text>
  <!-- Lombard -->
  <text x="164" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">Lombard</text>
  <!-- General Insurance -->
  <line x1="50" y1="72" x2="95" y2="72" stroke="white" stroke-width="1.5"/>
  <text x="100" y="77" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="white" letter-spacing="3">GENERAL INSURANCE</text>
  <line x1="268" y1="72" x2="310" y2="72" stroke="white" stroke-width="1.5"/>
</svg>
