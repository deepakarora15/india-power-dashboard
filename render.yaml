services:
  - type: web
    name: india-power-dashboard
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars: []
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
